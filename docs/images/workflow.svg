<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AtlasCrafter: from a world folder to a shared map</title>
  <desc id="desc">A Project contains an Atlas backed by a read-only Minecraft world folder. Multiple Renders configure views of that world. Administrators configure and queue BlueMap jobs; authorized members explore the maps.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#72a8f3"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif}
      .title{font-size:30px;font-weight:700;fill:#f0f5ff}
      .heading{font-size:21px;font-weight:600;fill:#e9f1ff}
      .label{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#8dbbff}
      .body{font-size:16px;fill:#c1cede}
      .small{font-size:14px;fill:#a3b5cd}
      .card{fill:#142b45;stroke:#315172;stroke-width:1.5}
      .connector{fill:none;stroke:#72a8f3;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#0b1b2e"/>
  <text x="40" y="52" class="label">ATLASCRAFTER · WORKFLOW OVERVIEW</text>
  <text x="40" y="98" class="title">From a world folder to a shared map</text>
  <text x="40" y="130" class="body">Organize worlds, prepare different views, and share them with your Project members.</text>
  <rect x="40" y="179" width="274" height="153" rx="12" class="card"/>
  <text x="63" y="211" class="label">PROJECT</text>
  <text x="63" y="247" class="heading">Survival Server</text>
  <text x="63" y="276" class="body">Worlds and member access</text>
  <text x="63" y="307" class="small">Administrators and read-only users</text>
  <path d="M314 254H376" class="connector"/>
  <rect x="384" y="179" width="309" height="153" rx="12" class="card"/>
  <text x="407" y="211" class="label">ATLAS</text>
  <text x="407" y="247" class="heading">Survival World</text>
  <text x="407" y="276" class="body">One physical Minecraft world</text>
  <rect x="407" y="291" width="263" height="25" rx="5" fill="#203d43"/>
  <text x="420" y="309" font-size="13" fill="#a3dfcc">World folder: read-only source</text>
  <path d="M693 254H725V202H757M725 254H757M725 254V306H757" class="connector"/>
  <rect x="765" y="179" width="395" height="46" rx="9" class="card"/>
  <rect x="765" y="231" width="395" height="46" rx="9" class="card"/>
  <rect x="765" y="283" width="395" height="46" rx="9" class="card"/>
  <text x="784" y="208" class="body">Render: Overworld · Day</text>
  <text x="784" y="260" class="body">Render: Overworld · Night</text>
  <text x="784" y="312" class="body">Render: The Nether</text>
  <path d="M40 368H1160" stroke="#29425e"/>
  <text x="40" y="400" class="label">FOR EACH RENDER</text>
  <rect x="40" y="421" width="247" height="92" rx="10" class="card"/>
  <text x="60" y="453" class="heading">Configure</text>
  <text x="60" y="482" class="small">Forms, resources, markers</text>
  <path d="M287 467H323" class="connector"/>
  <rect x="331" y="421" width="247" height="92" rx="10" class="card"/>
  <text x="351" y="453" class="heading">Queue a job</text>
  <text x="351" y="482" class="small">Update, rebuild, or publish</text>
  <path d="M578 467H614" class="connector"/>
  <rect x="622" y="421" width="247" height="92" rx="10" class="card"/>
  <text x="642" y="453" class="heading">BlueMap runs</text>
  <text x="642" y="482" class="small">Worker invokes the CLI</text>
  <path d="M869 467H905" class="connector"/>
  <rect x="913" y="421" width="247" height="92" rx="10" fill="#183b40" stroke="#4b8b81" stroke-width="1.5"/>
  <text x="933" y="453" class="heading">Explore the map</text>
  <text x="933" y="482" class="small">Viewer and assets behind login</text>
  <text x="1160" y="541" text-anchor="end" font-size="12" fill="#8298b2">Illustrative names · diagram, not a UI screenshot</text>
</svg>
